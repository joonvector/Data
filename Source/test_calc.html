test<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파이썬 없는 계산기 (JS 버전)</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #222;
        font-family: Arial, sans-serif;
        margin: 0;
    }
    .calculator {
        background: #333;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #display {
        width: 100%;
        height: 50px;
        font-size: 24px;
        text-align: right;
        margin-bottom: 10px;
        border-radius: 8px;
        border: none;
        padding: 5px 10px;
        box-sizing: border-box;
    }
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 60px);
        gap: 8px;
    }
    button {
        height: 55px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #555;
        color: white;
        cursor: pointer;
    }
    button:hover { background: #777; }
    .operator { background: #e67e22; }
    .equal { background: #27ae60; grid-column: span 2; }
    .clear { background: #c0392b; }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="square()">x²</button>
        <button onclick="sqrt()">√</button>

        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
function appendValue(val) {
    document.getElementById("display").value += val;
}

function clearDisplay() {
    document.getElementById("display").value = "";
}

function square() {
    const display = document.getElementById("display");
    try {
        const val = eval(display.value);
        display.value = Math.pow(val, 2);
    } catch (e) {
        display.value = "Error";
    }
}

function sqrt() {
    const display = document.getElementById("display");
    try {
        const val = eval(display.value);
        if (val < 0) {
            display.value = "Error";
        } else {
            display.value = Math.sqrt(val);
        }
    } catch (e) {
        display.value = "Error";
    }
}

function calculate() {
    const display = document.getElementById("display");
    try {
        display.value = eval(display.value);
    } catch (e) {
        display.value = "Error";
    }
}
</script>

</body>
</html>
