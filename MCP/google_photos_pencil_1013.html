*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#282d2b;color:#f4eedf;font-family:Paper,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:18px}
main{width:min(100%,480px)}.sheet{position:relative;width:100%;aspect-ratio:9/16;background:#f6f0df;box-shadow:0 16px 70px #0007;border-radius:3px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}.controls{padding:16px 2px 0;display:grid;grid-template-columns:42px 1fr 74px;align-items:center;gap:13px}
button{width:42px;height:42px;border:1px solid #d8d0b665;border-radius:50%;background:transparent;color:#efe8d5;cursor:pointer;display:grid;place-items:center}button:hover{background:#ffffff12}button:focus-visible,input:focus-visible{outline:2px solid #b6cfbc;outline-offset:5px}
button svg{width:17px;height:17px;fill:currentColor}input[type=range]{width:100%;margin:0;accent-color:#b6cfbc;cursor:pointer;height:25px}time{font:12px Paper,monospace;white-space:nowrap;color:#d7d3c7}.note{text-align:center;font-size:10px;letter-spacing:1px;color:#b1b4aa;margin:12px 0 0}
@media(max-height:950px) and (min-width:600px){main{width:min(430px,calc((100dvh - 120px)*9/16))}}
@media(max-width:500px){body{padding:12px}main{width:min(100%,calc((100dvh - 112px)*9/16))}.controls{gap:9px}.note{font-size:9px;letter-spacing:.3px}}
</style>
